<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credential Verification Portal</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #ffffff; max-width: 540px; width: 100%; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 32px; border-top: 6px solid #1e3a8a; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 16px; }
    .badge-valid { background: #dcfce7; color: #15803d; }
    .badge-invalid { background: #fee2e2; color: #b91c1c; }
    h2 { margin: 0 0 16px 0; color: #0f172a; font-size: 1.5rem; border-bottom: 2px solid #f8fafc; padding-bottom: 8px; }
    .meta-row { display: flex; justify-content: space-between; border-bottom: 1px solid #e2e8f0; padding: 10px 0; font-size: 0.95rem; }
    .meta-label { color: #64748b; font-weight: 500; }
    .meta-value { color: #0f172a; font-weight: 600; text-align: right; }
    .curriculum { margin-top: 22px; background: #f8fafc; border-radius: 8px; padding: 16px; border: 1px solid #e2e8f0; }
    .curriculum h4 { margin: 0 0 10px 0; color: #334155; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .curriculum ul { margin: 0; padding-left: 20px; color: #334155; font-size: 0.92rem; line-height: 1.6; }
    .search-box { margin-top: 20px; display: flex; gap: 8px; }
    .search-box input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .search-box button { background: #1e3a8a; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

<div class="card">
  <div id="loader" style="color: #64748b; text-align: center;">Verifying credential against official registry...</div>
  
  <div id="result" style="display: none;">
    <div id="statusBadge" class="badge"></div>
    <h2 id="recipientName"></h2>
    
    <div class="meta-row">
      <span class="meta-label">Certificate ID:</span>
      <span class="meta-value" id="dispCertId"></span>
    </div>
    <div class="meta-row">
      <span class="meta-label">Army No:</span>
      <span class="meta-value" id="dispArmyNo"></span>
    </div>
    <div class="meta-row">
      <span class="meta-label">Unit:</span>
      <span class="meta-value" id="dispUnit"></span>
    </div>
    <div class="meta-row">
      <span class="meta-label">Issue Date:</span>
      <span class="meta-value" id="dispDate"></span>
    </div>
    <div class="meta-row" id="gradeRow" style="display: none;">
      <span class="meta-label">Grading:</span>
      <span class="meta-value" id="dispGrade"></span>
    </div>
    
    <div class="curriculum">
      <h4>Areas & Competencies Covered</h4>
      <ul id="dispCurriculum"></ul>
    </div>
  </div>

  <div id="notFound" style="display: none;">
    <div class="badge badge-invalid">Record Not Found</div>
    <h3 style="margin-top:0; color:#1e293b;">Credential Unverified</h3>
    <p style="color:#64748b; font-size: 0.9rem;">No official record matches the supplied certificate identifier.</p>
    <div class="search-box">
      <input type="text" id="manualInput" placeholder="e.g. CERT-2026-IT-001" />
      <button onclick="manualSearch()">Search</button>
    </div>
  </div>
</div>

<script>
  // PASTE YOUR PUBLISHED GOOGLE SHEET CSV LINK HERE:
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSPx0_t-yFWld8Egh1vz9IfkT22xc4uHWAfn3U4uZpHV-atPr--VCdP80IVuRkqY6H1LH4_AaGxT7oq/pub?output=csv";

  // Robust CSV parser that correctly handles multi-word strings and quotes
  function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
    if (lines.length < 2) return [];

    function splitRow(row) {
      const values = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < row.length; i++) {
        const char = row[i];
        if (char === '"') {
          if (inQuotes && row[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          values.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }
      values.push(current.trim());
      return values;
    }

    const headers = splitRow(lines[0]).map(h => h.replace(/^["']|["']$/g, '').trim().toLowerCase());

    return lines.slice(1).map(line => {
      const rowValues = splitRow(line);
      const record = {};
      headers.forEach((header, index) => {
        record[header] = rowValues[index] ? rowValues[index].replace(/^["']|["']$/g, '').trim() : "";
      });
      return record;
    });
  }

  async function verifyCertificate(targetId) {
    const loader = document.getElementById("loader");
    const result = document.getElementById("result");
    const notFound = document.getElementById("notFound");

    loader.style.display = "block";
    result.style.display = "none";
    notFound.style.display = "none";

    try {
      const response = await fetch(SHEET_CSV_URL);
      const csvData = await response.text();
      const records = parseCSV(csvData);

      const cert = records.find(r => r.cert_id && r.cert_id.toLowerCase() === targetId.toLowerCase().trim());

      loader.style.display = "none";
      if (cert) {
        document.getElementById("statusBadge").className = "badge badge-valid";
        document.getElementById("statusBadge").innerText = cert.status || "VERIFIED";
        document.getElementById("recipientName").innerText = cert.name;
        document.getElementById("dispCertId").innerText = cert.cert_id;
        document.getElementById("dispArmyNo").innerText = cert.army_number || "—";
        document.getElementById("dispUnit").innerText = cert.unit || "—";
        document.getElementById("dispDate").innerText = cert.issue_date;

        // Display Grade only if column exists and contains data
        if (cert.grade && cert.grade.trim().length > 0) {
          document.getElementById("dispGrade").innerText = cert.grade;
          document.getElementById("gradeRow").style.display = "flex";
        } else {
          document.getElementById("gradeRow").style.display = "none";
        }

        const curriculumList = document.getElementById("dispCurriculum");
        curriculumList.innerHTML = "";
        
        // Handles multi-topic strings or single entries cleanly
        const modules = cert.areas_covered.split(";").length > 1 
          ? cert.areas_covered.split(";") 
          : [cert.areas_covered];

        modules.forEach(m => {
          if (m.trim()) {
            const li = document.createElement("li");
            li.innerText = m.trim();
            curriculumList.appendChild(li);
          }
        });

        result.style.display = "block";
      } else {
        notFound.style.display = "block";
      }
    } catch (err) {
      loader.innerText = "Error connecting to certificate registry. Please verify connection.";
    }
  }

  function manualSearch() {
    const val = document.getElementById("manualInput").value;
    if (val) verifyCertificate(val);
  }

  window.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const certId = params.get("id");
    if (certId) {
      verifyCertificate(certId);
    } else {
      document.getElementById("loader").style.display = "none";
      document.getElementById("notFound").style.display = "block";
    }
  });
</script>

</body>
</html>
